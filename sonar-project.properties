sonar.projectKey=SeifEddineachouri_Smart-Doc-Backend-auth
sonar.organization=seifeddineachouri
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

sonar.exclusions=**/target/**,**/.idea/**,**/.git/**,**/*.log,**/logs/**,**/uploads/**,**/diag_*.json

# Java Version and Compilation
sonar.java.source=17
sonar.java.target=17

# Code Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Duplications
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/model/**

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Security Hotspot Settings
sonar.security.hotspots.ReviewRatedAsReviewedIntoAccount=true

# Performance Tuning
sonar.scm.exclusions.disabled=false

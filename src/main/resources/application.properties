spring.application.name=smartdoc
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/SmartDoc?binaryTransfer=true&stringtype=unspecified
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

# Increase document upload limits; override with env vars when needed.
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:100MB}

# Base64 key for local development only. Override in env for production.
app.jwt.secret=${APP_JWT_SECRET:U21hcnREb2NEZXZlbG9wbWVudEtleVNob3VsZEJlQXRMZWFzdDMyQnl0ZXM=}
app.jwt.access-token-seconds=3600
app.auth.refresh-short-days=1
app.auth.refresh-long-days=30
app.auth.refresh-cookie-name=refreshToken
app.auth.refresh-cookie-secure=false

# Keep docs public in local dev; disable in prod profile.
app.security.docs-public-enabled=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
app.documents.storage-dir=uploads

# Kafka audit stream (best-effort side channel)
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.audit-topic=${APP_KAFKA_AUDIT_TOPIC:smartdoc.audit.events}
app.kafka.client-id=${APP_KAFKA_CLIENT_ID:smartdoc}

# AiSmartDoc gateway (smartdoc delegates AI operations to this service)
app.ai-gateway.base-url=${APP_AI_GATEWAY_BASE_URL:http://localhost:8088/api/v1/ai}
app.ai-gateway.service-token=${APP_AI_GATEWAY_SERVICE_TOKEN:}
app.ai-gateway.ask-path=${APP_AI_GATEWAY_ASK_PATH:/questions}
app.ai-gateway.connect-timeout-ms=${APP_AI_GATEWAY_CONNECT_TIMEOUT_MS:3000}
app.ai-gateway.read-timeout-ms=${APP_AI_GATEWAY_READ_TIMEOUT_MS:30000}


services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SmartDoc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SmartDoc}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.1
    container_name: smartdoc-kafka
    restart: unless-stopped
    user: "0"
    environment:
      CLUSTER_ID: ${CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@smartdoc-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://smartdoc-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "[ -x /opt/kafka/bin/kafka-topics.sh ] && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  smartdoc-ai:
    image: smartdoc-ai:local
    build:
      context: ./smartdoc-ai
    container_name: smartdoc-ai
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-shared-service-token}
      APP_AI_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-shared-service-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.1}
      CHUNK_SIZE_WORDS: ${CHUNK_SIZE_WORDS:-220}
      CHUNK_OVERLAP_WORDS: ${CHUNK_OVERLAP_WORDS:-30}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
    ports:
      - "${SMARTDOC_AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  AiSmartDoc:
    image: aismartdoc:local
    build:
      context: ./AiSmartDoc
    container_name: aismartdoc
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-http://smartdoc-ai:8000}
      APP_AI_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-shared-service-token}
      APP_AI_CONNECT_TIMEOUT_MS: ${APP_AI_CONNECT_TIMEOUT_MS:-3000}
      APP_AI_READ_TIMEOUT_MS: ${APP_AI_READ_TIMEOUT_MS:-15000}
    ports:
      - "${AISMARTDOC_PORT:-8088}:8088"
    depends_on:
      smartdoc-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/api/v1/ai/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smartdoc:
    image: smartdoc:local
    build:
      context: .
    container_name: smartdoc
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/SmartDoc
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-secret}
      APP_UPLOAD_MAX_FILE_SIZE: ${APP_UPLOAD_MAX_FILE_SIZE:-100MB}
      APP_UPLOAD_MAX_REQUEST_SIZE: ${APP_UPLOAD_MAX_REQUEST_SIZE:-100MB}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APP_KAFKA_AUDIT_TOPIC: ${APP_KAFKA_AUDIT_TOPIC:-smartdoc.audit.events}
      APP_KAFKA_CLIENT_ID: ${APP_KAFKA_CLIENT_ID:-smartdoc}
      APP_AI_GATEWAY_BASE_URL: ${APP_AI_GATEWAY_BASE_URL:-http://aismartdoc:8088/api/v1/ai}
      APP_AI_GATEWAY_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-shared-service-token}
    ports:
      - "${SMARTDOC_PORT:-8087}:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      AiSmartDoc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/v3/api-docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  payment-service:
    image: smartdoc-payment-service:latest
    build:
      context: ./payment-service-spring
    container_name: smartdoc-payment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8089
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      PAYMENT_CHECKOUT_MODE: ${PAYMENT_CHECKOUT_MODE:-stripe}
      PAYMENT_CHECKOUT_BASE_URL: ${PAYMENT_CHECKOUT_BASE_URL:-https://checkout.stripe.com/pay}
      PAYMENT_CHECKOUT_RETURN_URL: ${PAYMENT_CHECKOUT_RETURN_URL:-http://localhost:4200/billing/success}
      PAYMENT_CHECKOUT_CANCEL_URL: ${PAYMENT_CHECKOUT_CANCEL_URL:-http://localhost:4200/billing/cancel}
      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY}
      PAYMENT_STRIPE_WEBHOOK_SECRET: ${PAYMENT_STRIPE_WEBHOOK_SECRET:-dev-webhook-secret}
      PAYMENT_INTERNAL_TOKEN: ${PAYMENT_INTERNAL_TOKEN:-dev-internal-token}
      PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
      PAYMENT_DEFAULT_PLAN_ID: ${PAYMENT_DEFAULT_PLAN_ID:-pro-monthly}
      PAYMENT_DEFAULT_PLAN_NAME: ${PAYMENT_DEFAULT_PLAN_NAME:-SmartDoc Pro Monthly}
      PAYMENT_DEFAULT_PLAN_PRICE_CENTS: ${PAYMENT_DEFAULT_PLAN_PRICE_CENTS:-1999}
      PAYMENT_DEFAULT_PLAN_CURRENCY: ${PAYMENT_DEFAULT_PLAN_CURRENCY:-eur}
      PAYMENT_DEFAULT_PLAN_INTERVAL: ${PAYMENT_DEFAULT_PLAN_INTERVAL:-month}
      PAYMENT_DEFAULT_PLAN_ACTIVE: ${PAYMENT_DEFAULT_PLAN_ACTIVE:-true}
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: smartdoc-frontend:local
    build:
      context: "${SMARTDOC_FRONTEND_PATH:-C:/Users/seifa/Desktop/SmartDoc}"
    container_name: smartdoc-frontend
    restart: unless-stopped
    depends_on:
      smartdoc:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  kafka_data:


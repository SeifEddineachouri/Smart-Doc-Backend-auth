name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smartdoc tests and coverage
        run: ./mvnw verify

      - name: Run AiSmartDoc tests and coverage
        working-directory: AiSmartDoc
        run: ./mvnw verify

      - name: Install smartdoc-ai dependencies
        working-directory: smartdoc-ai
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run smartdoc-ai tests with coverage
        working-directory: smartdoc-ai
        run: pytest

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties

      - name: SonarCloud Scan - AiSmartDoc
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=AiSmartDoc/sonar-project.properties

      - name: SonarCloud Scan - smartdoc-ai
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=smartdoc-ai/sonar-project.properties


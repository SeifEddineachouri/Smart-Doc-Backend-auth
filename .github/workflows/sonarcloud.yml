name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smartdoc tests and coverage
        run: ./mvnw verify
        continue-on-error: true

      - name: Run AiSmartDoc tests and coverage
        if: hashFiles('AiSmartDoc/pom.xml') != ''
        working-directory: AiSmartDoc
        run: ./mvnw verify
        continue-on-error: true

      - name: Install smartdoc-ai dependencies
        if: hashFiles('smartdoc-ai/requirements.txt') != ''
        working-directory: smartdoc-ai
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
        continue-on-error: true

      - name: Run smartdoc-ai tests with coverage
        if: hashFiles('smartdoc-ai/requirements.txt') != ''
        working-directory: smartdoc-ai
        run: pytest
        continue-on-error: true

      - name: SonarCloud Scan - smartdoc
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
        continue-on-error: true

      - name: SonarCloud Scan - AiSmartDoc
        if: secrets.SONAR_TOKEN != '' && hashFiles('AiSmartDoc/pom.xml') != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=AiSmartDoc/sonar-project.properties
        continue-on-error: true

      - name: SonarCloud Scan - smartdoc-ai
        if: secrets.SONAR_TOKEN != '' && hashFiles('smartdoc-ai/requirements.txt') != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=smartdoc-ai/sonar-project.properties
        continue-on-error: true

      - name: Skip notice - SonarCloud scan
        if: secrets.SONAR_TOKEN == ''
        run: echo "⏭️  SonarCloud scan skipped - SONAR_TOKEN not configured"


name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrappers executable
        run: |
          chmod +x mvnw
          chmod +x AiSmartDoc/mvnw

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smartdoc tests and coverage
        run: ./mvnw verify
        continue-on-error: true

      - name: SonarCloud Scan - smartdoc
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dproject.settings=sonar-project.properties
        continue-on-error: true

      - name: Skip notice - SonarCloud scan
        if: secrets.SONAR_TOKEN == ''
        run: echo "⏭️  SonarCloud scan skipped - SONAR_TOKEN not configured"

      - name: SonarCloud Scan - AiSmartDoc
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dproject.settings=AiSmartDoc/sonar-project.properties
            -Dsonar.projectBaseDir=AiSmartDoc
        continue-on-error: true

      - name: SonarCloud Scan - smartdoc-ai
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dproject.settings=smartdoc-ai/sonar-project.properties
            -Dsonar.projectBaseDir=smartdoc-ai
        continue-on-error: true
